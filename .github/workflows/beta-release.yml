name: Beta Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*-beta*"

jobs:
  export-macos:
    name: Export macOS beta
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.6
    steps:
      - uses: actions/checkout@v6

      - name: Prepare export preset
        run: cp build/export_presets.cfg export_presets.cfg

      - name: Import project
        run: godot --headless --path . --import --quit

      - name: Export macOS build
        run: |
          mkdir -p export
          godot --headless --path . --export-release "macOS" export/ThreeGame_macOS.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThreeGame_macOS
          path: export/ThreeGame_macOS.zip
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Three Game ${{ github.ref_name }}
          body_path: docs/BETA_PLAY.md
          draft: false
          prerelease: true
          files: export/ThreeGame_macOS.zip
          generate_release_notes: true
