[project]
name = "triad-analytics"
version = "0.1.0"
description = "Telemetry pipeline for Triad Protocol: JSONL -> DuckDB -> dbt marts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.3,<2",
    "dbt-core>=1.10,<1.12",
    "dbt-duckdb>=1.9.4,<1.11",
]

[project.scripts]
triad-ingest = "triad_analytics.ingest:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triad_analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
